name: Deploy dashboard site

# Publishes site/ to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/ (Settings → Pages → Deploy from branch: gh-pages).

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init --quiet -b gh-pages
          git add -A
          git -c user.name="tradebot-pages" -c user.email="tradebot-pages@users.noreply.github.com" \
            commit --quiet -m "Deploy site from ${GITHUB_SHA::7}"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
