<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeBot {% block title %}{% endblock %}</title>
  <style>
    :root {
      --bg:         #0d0d0d;
      --surface:    #161616;
      --surface2:   #1e1e1e;
      --border:     #2a2a2a;
      --green:      #00c896;
      --green-dim:  #0d2e20;
      --red:        #ff4d4d;
      --red-dim:    #2a0f0f;
      --yellow:     #f5c842;
      --yellow-dim: #2a2000;
      --text:       #e0e0e0;
      --muted:      #666;
      --font:       'Segoe UI', system-ui, sans-serif;
      --mono:       'Cascadia Code', 'Consolas', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

    /* ── Nav ── */
    nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 28px; display: flex; align-items: center; height: 52px; gap: 0;
      position: sticky; top: 0; z-index: 50;
    }
    .nav-brand {
      font-size: 15px; font-weight: 700; color: var(--green);
      letter-spacing: .5px; margin-right: 36px; text-decoration: none;
    }
    .nav-brand span { color: var(--text); }
    nav a.nav-link {
      color: var(--muted); text-decoration: none; font-size: 13px;
      padding: 0 14px; height: 52px; display: flex; align-items: center;
      border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
    }
    nav a.nav-link:hover  { color: var(--text); }
    nav a.nav-link.active { color: var(--text); border-bottom-color: var(--green); }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    /* ── Layout ── */
    main { max-width: 1040px; margin: 0 auto; padding: 32px 28px; }
    h1   { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    h2   { font-size: 14px; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px 22px; margin-bottom: 16px;
    }
    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 3px 9px;
      border-radius: 20px; letter-spacing: .2px; white-space: nowrap;
    }
    .badge-green  { background: var(--green-dim);  color: var(--green);  }
    .badge-red    { background: var(--red-dim);    color: var(--red);    }
    .badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
    .badge-gray   { background: var(--surface2);   color: var(--muted); border: 1px solid var(--border); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
      border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
      border: none; transition: opacity .15s; text-decoration: none;
      font-family: var(--font); line-height: 1;
    }
    .btn:hover    { opacity: .82; }
    .btn-primary  { background: var(--green);    color: #000; }
    .btn-stop     { background: var(--red-dim);  color: var(--red); border: 1px solid #4a1212; }
    .btn-ghost    { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: #555; opacity: 1; }
    .btn-danger   { background: var(--red-dim);  color: var(--red); border: 1px solid #4a1212; }
    .btn-sm       { padding: 6px 12px; font-size: 12px; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ── Forms ── */
    .form-group  { margin-bottom: 16px; }
    label        { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: .3px; text-transform: uppercase; }
    input[type="text"], input[type="password"], input[type="email"],
    input[type="number"], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 9px 12px; color: var(--text);
      font-size: 13px; font-family: var(--font); transition: border-color .15s;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--green); }
    textarea { resize: vertical; min-height: 64px; font-family: var(--mono); }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .input-row .form-group { flex: 1; margin-bottom: 0; }

    /* ── Info tooltip ── */
    .info-wrap { position: relative; display: inline-flex; align-items: center; }
    .info-btn {
      width: 17px; height: 17px; border-radius: 50%; background: var(--surface2);
      border: 1px solid var(--border); color: var(--muted); font-size: 9px;
      font-weight: 700; cursor: default; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .info-btn:hover { border-color: var(--green); color: var(--green); }
    .tooltip {
      position: absolute; left: 24px; top: -6px; width: 270px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; font-size: 12px;
      color: var(--text); line-height: 1.6; z-index: 200; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
    }
    .tooltip a { color: var(--green); }
    .info-wrap:hover .tooltip { display: block; }

    /* ── Log ── */
    .log-wrap {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      height: 220px; overflow-y: auto; padding: 12px;
      font-family: var(--mono); font-size: 12px;
    }
    .log-line { padding: 1px 0; line-height: 1.55; }
    .log-time { color: var(--muted); margin-right: 8px; user-select: none; }
    .log-INFO    .log-msg { color: var(--text);   }
    .log-WARNING .log-msg { color: var(--yellow); }
    .log-ERROR   .log-msg { color: var(--red);    }

    /* ── Alerts ── */
    .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
    .alert-error   { background: var(--red-dim);    color: var(--red);    border: 1px solid #4a1212; }
    .alert-warning { background: var(--yellow-dim); color: var(--yellow); border: 1px solid #4a3800; }
    .alert-success { background: var(--green-dim);  color: var(--green);  border: 1px solid #0a3020; }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    @media (max-width: 680px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    /* ── Divider ── */
    hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 18px; font-size: 13px;
      display: none; z-index: 999;
    }
    #toast.show { display: block; }

    /* ── Stat box ── */
    .stat-box { text-align: center; padding: 18px 12px; }
    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .stat-value { font-size: 24px; font-weight: 700; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">Trade<span>Bot</span></a>
  <a href="/"          class="nav-link {% if request.endpoint == 'index'     %}active{% endif %}">Dashboard</a>
  <a href="/portfolio" class="nav-link {% if request.endpoint == 'portfolio' %}active{% endif %}">Portfolio</a>
  <a href="/configure" class="nav-link {% if request.endpoint == 'configure' %}active{% endif %}">Configure</a>
  <div class="nav-right">
    <a href="/logout" class="btn btn-ghost btn-sm">Lock</a>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<div id="toast"></div>

<script>
function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = ok ? 'var(--green)' : 'var(--red)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
async function post(url, body = {}) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  return r.json();
}
function pnlStyle(n) {
  const v = parseFloat(n);
  if (isNaN(v)) return '';
  return `color:${v >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600;`;
}
function fmt$(n, def = '—') {
  const v = parseFloat(n);
  if (isNaN(v) || n == null) return def;
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtPct(n) {
  const v = parseFloat(n);
  return isNaN(v) ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function fmtDate(s) {
  if (!s) return '—';
  try { return new Date(s).toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch { return s; }
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
